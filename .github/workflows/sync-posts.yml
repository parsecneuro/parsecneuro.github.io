name: Synchronize public posts

on:
  workflow_dispatch:

# This optional workflow is manual by default. Configure POSTS_FEED_URL before
# running it. Add a schedule later only if automatic feed updates are needed.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Update feed data
        env:
          POSTS_FEED_URL: ${{ secrets.POSTS_FEED_URL }}
        run: node scripts/sync-posts.mjs

      - name: Commit changed feed data
        run: |
          if git diff --quiet -- assets/data/posts-feed.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/posts-feed.json
          git commit -m "Update public posts feed"
          git push
